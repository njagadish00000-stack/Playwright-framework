[pytest]
testpaths = api_tests ui_tests api_ui_tests e2e_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --alluredir=reports/allure-results --clean-alluredir
markers =
    api: API automation tests
    ui: UI automation tests (Playwright)
    api_ui: combined API + UI tests
    e2e: end-to-end workflow tests
    smoke: smoke test subset (fast, critical)
    regression: regression test subset
